name: ConstellationAR

options:
  bundleIdPrefix: org.constellationar
  deploymentTarget:
    iOS: "27.0"
  developmentLanguage: en
  createIntermediateGroups: true

configFiles:
  Debug: Config/Config.xcconfig
  Release: Config/Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"

packages:
  SkyCore:
    path: Packages/SkyCore

targets:
  ConstellationAR:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: App
        excludes:
          - "Render/MetalSource/**"
          - "UITests/**"
          - "UnitTests/**"
      # Copied verbatim (a folder reference is not run through the Metal compiler) and compiled at runtime with
      # MTLDevice.makeLibrary(source:), because the Metal Toolchain is a separate Xcode download.
      - path: App/Render/MetalSource
        type: folder
        buildPhase: resources
      - path: Data
        optional: true
        buildPhase: none
        excludes:
          - "fixtures/**"
          - "test/**"
    dependencies:
      - package: SkyCore
        product: SkyCore
    postBuildScripts:
      - name: Bundle Data
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          src="${SRCROOT}/Data"
          dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          [ -d "$src" ] || exit 0
          mkdir -p "$dest"
          find "$src" -maxdepth 1 -type f \( -name '*.bin' -o -name '*.json' \) -exec cp -p {} "$dest/" \;
          if [ -d "$src/artwork" ]; then
            rm -rf "$dest/artwork"
            ditto "$src/artwork" "$dest/artwork"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.constellationar.ConstellationAR
        PRODUCT_NAME: ConstellationAR
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ConstellationAR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarHidden: true
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: The camera shows the sky so constellations can be drawn over it.
        NSLocationWhenInUseUsageDescription: Your location sets which stars are above you and points the compass at true north.
        NSMotionUsageDescription: Motion sensors tell the app where the phone is pointing in the sky.
        CADisableMinimumFrameDurationOnPhone: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        VertexAPIKey: $(VERTEX_API_KEY)
        GemmaModelID: $(GEMMA_MODEL_ID)
        GCPProjectID: $(GCP_PROJECT_ID)
        GemmaLocation: $(GEMMA_LOCATION)
    scheme:
      testTargets:
        - ConstellationARTests
        - ConstellationARUITests

  ConstellationARUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: App/UITests
    dependencies:
      - target: ConstellationAR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.constellationar.ConstellationARUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: ConstellationAR

  ConstellationARTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: App/UnitTests
    dependencies:
      - target: ConstellationAR
      - package: SkyCore
        product: SkyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.constellationar.ConstellationARTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
