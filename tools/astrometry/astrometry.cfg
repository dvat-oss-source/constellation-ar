# astrometry.net config for the Mac-only calibration/cross-check tool.
# Index files: Tycho-2 4100 series (4110..4119), ~47 MB, downloaded by hand into tools/.cache/astrometry/.
# solve.sh resolves this repository-relative index path at runtime.
inparallel
cpulimit 60
add_path tools/.cache/astrometry
autoindex
